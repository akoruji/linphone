[general]
static=yes
writeprotect=no
clearglobalvars=no

[internal]
; Extension 1001 can call extension 1002, and vice versa.
exten => 1001,1,Dial(PJSIP/1001,30)
 same => n,Hangup()

exten => 1002,1,Dial(PJSIP/1002,30)
 same => n,Hangup()

; Optional simple echo test: dial *43 from a registered Linphone client.
exten => *43,1,Answer()
 same => n,Echo()
 same => n,Hangup()
