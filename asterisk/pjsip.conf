[global]
type=global
user_agent=Asterisk-Linphone-Docker

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---------- Extension 1001 ----------
[1001]
type=endpoint
context=internal
disallow=all
allow=ulaw
allow=alaw
auth=auth1001
aors=1001
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[auth1001]
type=auth
auth_type=userpass
username=1001
password=CHANGE_THIS_1001_PASSWORD

[1001]
type=aor
max_contacts=3
remove_existing=yes

